name: example 01
run-name: example 01

on:
  pull_request:
    types:
      - closed

jobs:
  comment-on-pr:
    runs-on: ubuntu-latest
    # runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4.2.2
      - name: comment on PR
        run: gh pr comment ${{ github.event.pull_request.number }} --body "This PR has been closed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
